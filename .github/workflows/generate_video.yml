name: Gerador de Lendas Urbanas PRO

on:
  schedule:
    - cron: '0 6 * * *' # Roda sozinho todos os dias às 06:00 UTC
  workflow_dispatch:
    inputs:
      lenda_manual:
        description: 'Digite o número da lenda (ex: 1)'
        required: false
        default: '1'

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar FFmpeg e Fontes
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Instalar dependências Python
        run: pip install -r requirements.txt

      - name: Gerar Vídeo da Lenda
        run: python generator.py "${{ github.event.inputs.lenda_manual || '1' }}"

      - name: Salvar Vídeo como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: lenda-gerada
          path: output/*.mp4
